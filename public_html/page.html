<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stay in the loop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <div class="card">
      <p class="eyebrow">Dispatch №1</p>
      <h1>Get the next update<br>before anyone else.</h1>
      <p class="sub">Drop your email in. No spam, unsubscribe whenever.</p>

      <form id="signup-form" novalidate>
        <!-- Honeypot field: hidden from real users via CSS, bots often fill it in -->
        <div class="hp-field" aria-hidden="true">
          <label for="website">Website</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <div class="field-row">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
          <button type="submit" id="submit-btn">
            <span class="btn-text">Notify me</span>
          </button>
        </div>
        <p class="msg" id="form-msg" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
